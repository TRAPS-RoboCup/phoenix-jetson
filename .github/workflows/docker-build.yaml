name: Docker Build Test

run-name: Docker Build Test:${{ github.ref_name }}(${{ github.event.head_commit.message }})

on:
  push:

jobs:
  docker-build:
    runs-on: ubuntu-22.04

    permissions:
      packages: write
      contents: read

     env:
       PLATFORMS: linux/amd64, linux/arm64/v8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: false

      - name: Extract metadata (tags, labels) for Docker
        id: set-docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Set up Docker Buildx
        id: set-docker-builder
        uses: docker/setup-buildx-action@v3
        with:
          platforms: ${{ env.PLATFORMS }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: docker
          file: ${{ github.action_path }}/Dockerfile
          push: true
          tags: ${{ steps.set-docker-metadata.outputs.tags }}
          labels: ${{ steps.set-docker-metadata.outputs.labels }}
          platforms: ${{ env.PLATFORMS }}
          builder: ${{ steps.set-docker-builder.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max